<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <style>
    .t { font-size: 19px; font-weight: 700; fill: #fff; }
    .c { font-size: 15px; fill: #2b2e33; font-family: Menlo, monospace; }
    .k { font-size: 15px; fill: #BC202E; font-family: Menlo, monospace; font-weight: 700; }
    .l { stroke: #8a8f98; stroke-width: 2; fill: none; }
    .lab { font-size: 14px; fill: #6b7078; font-style: italic; }
  </style>
  <rect width="1600" height="1060" fill="#ffffff"/>
  <text x="800" y="50" text-anchor="middle" font-size="34" font-weight="700" fill="#1d1f23">Entity–Relationship Diagram</text>
  <text x="800" y="82" text-anchor="middle" font-size="18" fill="#6b7078">Red = primary key · fk = foreign key · labels give cardinality</text>

  <!-- helper: entity box template drawn manually -->
  <!-- parties -->
  <g transform="translate(40,120)"><rect width="250" height="100" rx="8" fill="#fff" stroke="#3d4148"/><rect width="250" height="34" rx="8" fill="#3d4148"/><text x="12" y="23" class="t">parties</text>
    <text x="12" y="60" class="k">abbreviation</text><text x="12" y="84" class="c">name</text></g>
  <!-- mps -->
  <g transform="translate(40,300)"><rect width="250" height="220" rx="8" fill="#fff" stroke="#4F86BE" stroke-width="2"/><rect width="250" height="34" rx="8" fill="#4F86BE"/><text x="12" y="23" class="t">mps</text>
    <text x="12" y="60" class="k">id</text><text x="12" y="84" class="c">name, constituency</text><text x="12" y="108" class="c">state</text><text x="12" y="132" class="c">party_abbreviation fk</text><text x="12" y="156" class="c">house (enum)</text><text x="12" y="180" class="c">first_elected</text><text x="12" y="204" class="c">questions_asked</text></g>
  <!-- committees -->
  <g transform="translate(40,620)"><rect width="250" height="100" rx="8" fill="#fff" stroke="#3d4148"/><rect width="250" height="34" rx="8" fill="#3d4148"/><text x="12" y="23" class="t">committees</text>
    <text x="12" y="60" class="k">id</text><text x="12" y="84" class="c">name</text></g>
  <!-- mp_committees -->
  <g transform="translate(40,800)"><rect width="250" height="110" rx="8" fill="#fff" stroke="#8a8f98"/><rect width="250" height="34" rx="8" fill="#8a8f98"/><text x="12" y="23" class="t">mp_committees</text>
    <text x="12" y="60" class="k">mp_id, committee_id</text><text x="12" y="84" class="c">position</text></g>
  <!-- sessions -->
  <g transform="translate(380,120)"><rect width="270" height="124" rx="8" fill="#fff" stroke="#3d4148"/><rect width="270" height="34" rx="8" fill="#3d4148"/><text x="12" y="23" class="t">parliament_sessions</text>
    <text x="12" y="60" class="k">id</text><text x="12" y="84" class="c">ordinal, name</text><text x="12" y="108" class="c">short_label</text></g>
  <!-- attendance -->
  <g transform="translate(380,320)"><rect width="270" height="110" rx="8" fill="#fff" stroke="#8a8f98"/><rect width="270" height="34" rx="8" fill="#8a8f98"/><text x="12" y="23" class="t">attendance_records</text>
    <text x="12" y="60" class="k">mp_id, session_id</text><text x="12" y="84" class="c">attendance_percent</text></g>
  <!-- speeches -->
  <g transform="translate(380,520)"><rect width="270" height="200" rx="8" fill="#fff" stroke="#4F86BE" stroke-width="2"/><rect width="270" height="34" rx="8" fill="#4F86BE"/><text x="12" y="23" class="t">speeches</text>
    <text x="12" y="60" class="k">id</text><text x="12" y="84" class="c">mp_id fk</text><text x="12" y="108" class="c">bill_id fk (nullable)</text><text x="12" y="132" class="c">topic, spoken_on</text><text x="12" y="156" class="c">duration_minutes</text><text x="12" y="180" class="c">excerpt</text></g>
  <!-- engagements -->
  <g transform="translate(380,800)"><rect width="270" height="110" rx="8" fill="#fff" stroke="#8a8f98"/><rect width="270" height="34" rx="8" fill="#8a8f98"/><text x="12" y="23" class="t">bill_engagements</text>
    <text x="12" y="60" class="k">mp_id, bill_id, role</text><text x="12" y="84" class="c">role (enum)</text></g>
  <!-- bills -->
  <g transform="translate(760,380)"><rect width="270" height="200" rx="8" fill="#fff" stroke="#4F86BE" stroke-width="2"/><rect width="270" height="34" rx="8" fill="#4F86BE"/><text x="12" y="23" class="t">bills</text>
    <text x="12" y="60" class="k">id</text><text x="12" y="84" class="c">title, bill_number</text><text x="12" y="108" class="c">house (enum)</text><text x="12" y="132" class="c">ministry_id fk</text><text x="12" y="156" class="c">stage (enum)</text><text x="12" y="180" class="c">summary</text></g>
  <!-- key points -->
  <g transform="translate(760,120)"><rect width="270" height="110" rx="8" fill="#fff" stroke="#8a8f98"/><rect width="270" height="34" rx="8" fill="#8a8f98"/><text x="12" y="23" class="t">bill_key_points</text>
    <text x="12" y="60" class="k">bill_id, position</text><text x="12" y="84" class="c">point</text></g>
  <!-- stage events -->
  <g transform="translate(760,250)"><rect width="270" height="100" rx="8" fill="#fff" stroke="#8a8f98"/><rect width="270" height="34" rx="8" fill="#8a8f98"/><text x="12" y="23" class="t">bill_stage_events</text>
    <text x="12" y="60" class="k">bill_id, stage</text><text x="12" y="84" class="c">event_date, detail</text></g>
  <!-- follows -->
  <g transform="translate(760,650)"><rect width="270" height="110" rx="8" fill="#fff" stroke="#BC202E" stroke-width="2"/><rect width="270" height="34" rx="8" fill="#BC202E"/><text x="12" y="23" class="t">bill_follows</text>
    <text x="12" y="60" class="k">device_id, bill_id</text><text x="12" y="84" class="c">followed_at</text></g>
  <!-- ministries -->
  <g transform="translate(1130,120)"><rect width="250" height="100" rx="8" fill="#fff" stroke="#3d4148"/><rect width="250" height="34" rx="8" fill="#3d4148"/><text x="12" y="23" class="t">ministries</text>
    <text x="12" y="60" class="k">id</text><text x="12" y="84" class="c">name</text></g>
  <!-- bill_schemes -->
  <g transform="translate(1130,420)"><rect width="250" height="90" rx="8" fill="#fff" stroke="#8a8f98"/><rect width="250" height="34" rx="8" fill="#8a8f98"/><text x="12" y="23" class="t">bill_schemes</text>
    <text x="12" y="60" class="k">bill_id, scheme_id</text></g>
  <!-- schemes -->
  <g transform="translate(1130,580)"><rect width="250" height="150" rx="8" fill="#fff" stroke="#4F86BE" stroke-width="2"/><rect width="250" height="34" rx="8" fill="#4F86BE"/><text x="12" y="23" class="t">schemes</text>
    <text x="12" y="60" class="k">id</text><text x="12" y="84" class="c">name, sector</text><text x="12" y="108" class="c">ministry_id fk</text><text x="12" y="132" class="c">summary</text></g>
  <!-- fiscal -->
  <g transform="translate(1130,800)"><rect width="250" height="130" rx="8" fill="#fff" stroke="#8a8f98"/><rect width="250" height="34" rx="8" fill="#8a8f98"/><text x="12" y="23" class="t">fiscal_year_spend</text>
    <text x="12" y="60" class="k">scheme_id, label</text><text x="12" y="84" class="c">full_label</text><text x="12" y="108" class="c">allocation, actual</text></g>
  <!-- cag -->
  <g transform="translate(1420,640)"><rect width="160" height="110" rx="8" fill="#fff" stroke="#8a8f98"/><rect width="160" height="34" rx="8" fill="#8a8f98"/><text x="12" y="23" class="t">cag_findings</text>
    <text x="12" y="60" class="k">scheme_id</text><text x="12" y="84" class="c">ref, note</text></g>

  <!-- relationships -->
  <path class="l" d="M165 220 V300"/><text x="175" y="265" class="lab">1 : N</text>
  <path class="l" d="M110 520 V560 H20 V855 H40"/>
  <path class="l" d="M165 720 V800"/><text x="175" y="765" class="lab">1 : N</text>
  <path class="l" d="M290 375 H380"/><text x="300" y="365" class="lab">1 : N</text>
  <path class="l" d="M515 244 V320"/><text x="525" y="290" class="lab">1 : N</text>
  <path class="l" d="M290 470 H340 V600 H380"/><text x="300" y="590" class="lab">1 : N</text>
  <path class="l" d="M290 500 H320 V855 H380"/>
  <path class="l" d="M650 600 H700 V480 H760"/><text x="665" y="470" class="lab">N : 1</text>
  <path class="l" d="M650 855 H720 V560 H760"/>
  <path class="l" d="M895 230 V250"/>
  <path class="l" d="M895 350 V380"/><text x="905" y="370" class="lab">1 : N</text>
  <path class="l" d="M895 580 V650"/><text x="905" y="620" class="lab">1 : N</text>
  <path class="l" d="M1255 220 V280 H1060 V500 H1030"/><text x="1070" y="300" class="lab">ministry 1 : N bills</text>
  <path class="l" d="M1255 220 V280 H1400 V655 H1380"/><text x="1410" y="330" class="lab">1 : N schemes</text>
  <path class="l" d="M1030 465 H1130"/><text x="1045" y="455" class="lab">M : N</text>
  <path class="l" d="M1255 510 V580"/>
  <path class="l" d="M1255 730 V800"/><text x="1265" y="770" class="lab">1 : N</text>
  <path class="l" d="M1380 695 H1420"/><text x="1384" y="685" class="lab">1:1</text>
</svg>
