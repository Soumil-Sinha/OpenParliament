<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F86BE"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#1d1f23">OpenParliament — System Architecture</text>
  <text x="800" y="86" text-anchor="middle" font-size="19" fill="#6b7078">Three tiers: SwiftUI client · Node.js REST API · PostgreSQL</text>

  <!-- Tier 1: iOS -->
  <rect x="40" y="120" width="560" height="740" rx="18" fill="#f3f6fa" stroke="#4F86BE" stroke-width="2"/>
  <text x="70" y="160" font-size="24" font-weight="700" fill="#4F86BE">iOS app (SwiftUI, iOS 17+)</text>

  <rect x="70" y="185" width="500" height="250" rx="12" fill="#fff" stroke="#c9d3df"/>
  <text x="90" y="215" font-size="19" font-weight="700" fill="#1d1f23">Views  (Features/)</text>
  <text x="90" y="248" font-size="17" fill="#3d4148">MPs: MPListView · MPProfileView · AttendanceChart</text>
  <text x="90" y="276" font-size="17" fill="#3d4148">Bills: BillListView · BillDetailView · StageStepper</text>
  <text x="90" y="304" font-size="17" fill="#3d4148">Budget: BudgetListView · BudgetDetailView · SpendChart</text>
  <text x="90" y="332" font-size="17" fill="#3d4148">Following: FollowingListView</text>
  <text x="90" y="360" font-size="17" fill="#3d4148">Settings: ServerSettingsView</text>
  <text x="90" y="398" font-size="15" fill="#6b7078">Components/ · Navigation/ · Support/Theme</text>
  <text x="90" y="420" font-size="15" fill="#6b7078">@Environment(ParliamentStore.self)</text>

  <rect x="70" y="480" width="500" height="150" rx="12" fill="#fff" stroke="#4F86BE" stroke-width="2"/>
  <text x="90" y="512" font-size="19" font-weight="700" fill="#1d1f23">ParliamentStore  (@Observable)</text>
  <text x="90" y="544" font-size="17" fill="#3d4148">Single source of truth · load() · setFollowing()</text>
  <text x="90" y="572" font-size="17" fill="#3d4148">Joins: speakers(onBill:) · linkedSchemes(for:)</text>
  <text x="90" y="600" font-size="17" fill="#3d4148">Phase: idle → loading → ready / failed</text>

  <rect x="70" y="670" width="240" height="160" rx="12" fill="#fff" stroke="#c9d3df"/>
  <text x="88" y="702" font-size="18" font-weight="700" fill="#1d1f23">ParliamentAPI</text>
  <text x="88" y="732" font-size="15" fill="#3d4148">URLSession async/await</text>
  <text x="88" y="756" font-size="15" fill="#3d4148">DTO → Model mapping</text>
  <text x="88" y="780" font-size="15" fill="#3d4148">X-Device-ID header</text>
  <text x="88" y="804" font-size="15" fill="#3d4148">APIConfiguration</text>

  <rect x="330" y="670" width="240" height="160" rx="12" fill="#fff" stroke="#c9d3df" stroke-dasharray="6 5"/>
  <text x="348" y="702" font-size="18" font-weight="700" fill="#1d1f23">SampleData</text>
  <text x="348" y="732" font-size="15" fill="#3d4148">Bundled fixtures</text>
  <text x="348" y="756" font-size="15" fill="#3d4148">Offline fallback</text>
  <text x="348" y="780" font-size="15" fill="#3d4148">SwiftUI previews</text>
  <text x="348" y="804" font-size="15" fill="#3d4148">Source of seed.sql</text>

  <line x1="320" y1="440" x2="320" y2="474" stroke="#4F86BE" stroke-width="3" marker-end="url(#a)"/>
  <line x1="190" y1="635" x2="190" y2="664" stroke="#4F86BE" stroke-width="3" marker-end="url(#a)"/>
  <line x1="450" y1="635" x2="450" y2="664" stroke="#8a8f98" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#g)"/>

  <!-- HTTP -->
  <line x1="315" y1="750" x2="320" y2="750" stroke="none"/>
  <path d="M 600 560 L 690 560" stroke="#4F86BE" stroke-width="3" marker-end="url(#a)"/>
  <path d="M 690 600 L 600 600" stroke="#4F86BE" stroke-width="3" marker-end="url(#a)"/>
  <text x="645" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#4F86BE">HTTP</text>
  <text x="645" y="628" text-anchor="middle" font-size="15" fill="#6b7078">JSON</text>

  <!-- Tier 2: API -->
  <rect x="700" y="120" width="420" height="740" rx="18" fill="#fbf7f2" stroke="#BC202E" stroke-width="2"/>
  <text x="730" y="160" font-size="24" font-weight="700" fill="#BC202E">REST API (Node.js)</text>
  <rect x="730" y="185" width="360" height="290" rx="12" fill="#fff" stroke="#e4d6c8"/>
  <text x="750" y="215" font-size="19" font-weight="700" fill="#1d1f23">routes.js  · Router</text>
  <text x="750" y="248" font-size="16" fill="#3d4148" font-family="Menlo, monospace">GET  /api/health</text>
  <text x="750" y="274" font-size="16" fill="#3d4148" font-family="Menlo, monospace">GET  /api/snapshot</text>
  <text x="750" y="300" font-size="16" fill="#3d4148" font-family="Menlo, monospace">GET  /api/mps[/:id]</text>
  <text x="750" y="326" font-size="16" fill="#3d4148" font-family="Menlo, monospace">GET  /api/bills[/:id]</text>
  <text x="750" y="352" font-size="16" fill="#3d4148" font-family="Menlo, monospace">GET  /api/schemes[/:id]</text>
  <text x="750" y="378" font-size="16" fill="#3d4148" font-family="Menlo, monospace">GET  /api/speeches?mp=&amp;bill=</text>
  <text x="750" y="404" font-size="16" fill="#3d4148" font-family="Menlo, monospace">GET  /api/follows</text>
  <text x="750" y="430" font-size="16" fill="#3d4148" font-family="Menlo, monospace">PUT|DELETE /api/follows/:id</text>
  <text x="750" y="456" font-size="16" fill="#3d4148" font-family="Menlo, monospace">GET  /api/stats/followers</text>

  <rect x="730" y="520" width="360" height="170" rx="12" fill="#fff" stroke="#e4d6c8"/>
  <text x="750" y="552" font-size="19" font-weight="700" fill="#1d1f23">repositories/</text>
  <text x="750" y="584" font-size="16" fill="#3d4148">members · bills · schemes</text>
  <text x="750" y="610" font-size="16" fill="#3d4148">speeches · follows</text>
  <text x="750" y="642" font-size="15" fill="#6b7078">Parameterised SQL, nested with</text>
  <text x="750" y="664" font-size="15" fill="#6b7078">json_build_object / json_agg</text>

  <rect x="730" y="730" width="360" height="100" rx="12" fill="#fff" stroke="#e4d6c8"/>
  <text x="750" y="762" font-size="19" font-weight="700" fill="#1d1f23">db.js · pg.Pool</text>
  <text x="750" y="794" font-size="16" fill="#3d4148">max 10 connections</text>

  <line x1="910" y1="480" x2="910" y2="514" stroke="#BC202E" stroke-width="3" marker-end="url(#a)"/>
  <line x1="910" y1="695" x2="910" y2="724" stroke="#BC202E" stroke-width="3" marker-end="url(#a)"/>

  <!-- SQL -->
  <path d="M 1120 760 L 1210 760" stroke="#4F86BE" stroke-width="3" marker-end="url(#a)"/>
  <text x="1165" y="745" text-anchor="middle" font-size="15" font-weight="700" fill="#4F86BE">SQL</text>

  <!-- Tier 3: DB -->
  <rect x="1220" y="120" width="340" height="740" rx="18" fill="#f4f4f6" stroke="#3d4148" stroke-width="2"/>
  <text x="1250" y="160" font-size="24" font-weight="700" fill="#1d1f23">PostgreSQL 15</text>
  <text x="1250" y="190" font-size="16" fill="#6b7078">database: openparliament</text>
  <g font-size="16" fill="#3d4148">
    <text x="1250" y="232" font-weight="700" fill="#1d1f23">Vocabulary</text>
    <text x="1250" y="258">parties · ministries</text>
    <text x="1250" y="282">committees · parliament_sessions</text>
    <text x="1250" y="322" font-weight="700" fill="#1d1f23">Members</text>
    <text x="1250" y="348">mps · mp_committees</text>
    <text x="1250" y="372">attendance_records</text>
    <text x="1250" y="412" font-weight="700" fill="#1d1f23">Legislation</text>
    <text x="1250" y="438">bills · bill_key_points</text>
    <text x="1250" y="462">bill_stage_events</text>
    <text x="1250" y="486">bill_engagements · speeches</text>
    <text x="1250" y="526" font-weight="700" fill="#1d1f23">Budget</text>
    <text x="1250" y="552">schemes · fiscal_year_spend</text>
    <text x="1250" y="576">cag_findings · bill_schemes</text>
    <text x="1250" y="616" font-weight="700" fill="#1d1f23">Citizen activity</text>
    <text x="1250" y="642">bill_follows</text>
    <text x="1250" y="682" font-weight="700" fill="#1d1f23">Views</text>
    <text x="1250" y="708">mp_attendance_summary</text>
    <text x="1250" y="732">scheme_utilisation</text>
    <text x="1250" y="756">bill_follower_counts</text>
    <text x="1250" y="800" fill="#6b7078">17 tables · 3 enums · 3 views</text>
  </g>
</svg>
